name: Test
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  test:
    name: Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Test initial labels
        run: |
          echo ${{ github.event.pull_request.labels.*.name, 'Bug' }}
          echo ${{contains( github.event.pull_request.labels.*.name, 'Bug')}}
