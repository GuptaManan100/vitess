name: Test PRs
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Test PRs')
  cancel-in-progress: true

jobs:
  prevent_direct_prs:
    name: Test PRs
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add initial labels
        if: ${{ contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'bug')}}" == "true" ]]; then
            echo 'The "bug" label is set.'
          else
            echo 'The "bug" label is not set.'
            gh pr edit ${{ github.event.pull_request.number }} --add-label 'invalid'
            echo 'The "invalid" label has been set.'
            exit 1
          fi

      - name: Fail PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'invalid')}}" == "true" ]]; then
            echo 'The "invalid" label is set.'
            exit 1
          fi
